name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  SLNX: FlowMapper.slnx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore ${{ env.SLNX }}

      - run: dotnet build ${{ env.SLNX }} --no-restore -c Release

      - name: Run tests
        shell: bash
        run: |
          set +e
          exitcode=0
          dotnet test tests/FlowMapper.UnitTests/FlowMapper.UnitTests.csproj --no-build --no-restore -c Release --verbosity normal --logger "console;verbosity=detailed" 2>&1 || exitcode=$?
          dotnet test tests/FlowMapper.SnapshotTests/FlowMapper.SnapshotTests.csproj --no-build --no-restore -c Release --verbosity normal --logger "console;verbosity=detailed" 2>&1 || exitcode=$?
          dotnet test tests/FlowMapper.IntegrationTests/FlowMapper.IntegrationTests.csproj --no-build --no-restore -c Release --verbosity normal --logger "console;verbosity=detailed" 2>&1 || exitcode=$?
          dotnet test tests/FlowMapper.Generator.Tests/FlowMapper.Generator.Tests.csproj --no-build --no-restore -c Release --verbosity normal --logger "console;verbosity=detailed" 2>&1 || exitcode=$?
          exit $exitcode

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - run: dotnet restore ${{ env.SLNX }}

      - run: dotnet build ${{ env.SLNX }} --no-restore -c Release

      - run: dotnet pack ${{ env.SLNX }} -c Release -o nupkgs -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push nupkgs/*.nupkg `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
        shell: pwsh
